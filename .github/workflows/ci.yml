name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: pyflakes
        run: python -m pyflakes *.py tests/*.py

      - name: Self-check (test_rating.py)
        run: python test_rating.py

      - name: pytest
        run: python -m pytest -q

      - name: Offline demo (no network)
        run: python pivot.py --demo -o "$RUNNER_TEMP/demo"

      - name: Committed sample matches regenerated output
        run: |
          set -e
          for f in "$RUNNER_TEMP"/demo/*; do
            echo "comparing samples/$(basename "$f")"
            diff -u "samples/$(basename "$f")" "$f"
          done
